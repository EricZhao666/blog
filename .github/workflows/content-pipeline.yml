name: content-pipeline

# Batch 7C-3B：内容队列 → 候选提交 → 候选 PR（**不合并、不部署**）
#
# 触发：
#   * workflow_dispatch：人工指定队列分支（推荐，最容易审计）
#   * push 到 content/queue：入队即自动跑；注意下面"触发链"的说明
#
# 触发链（实测/文档依据）：
#   1. 用仓库内置 GITHUB_TOKEN 推送的提交**不会**再次触发 push 类工作流
#      → 候选分支的 push 不会引起二次运行，天然防循环；
#   2. 用 GITHUB_TOKEN 创建的 PR **不会**自动触发 pull_request 工作流
#      （GitHub 的既定行为：需要人工点 "Approve and run" 或使用 PAT/App）——
#      所以本工作流自己在候选分支上跑完整回归，不依赖 PR 触发的另一个 workflow；
#   3. 不使用个人 PAT 长期存储来绕过上述限制。
#
# 权限：全局置空，按 job 最小授权（禁止给所有步骤全局写权限）。

permissions: {}

on:
  workflow_dispatch:
    inputs:
      queue_ref:
        description: '队列分支（默认 content/queue）'
        required: false
        default: 'content/queue'
      dry_run:
        description: '只验证不建 PR / 不推候选分支（默认 true）'
        required: false
        default: 'true'
      allow_write:
        description: '允许写候选分支与开 PR（默认 false；只有显式 true 才会写）'
        required: false
        default: 'false'
  push:
    branches:
      - content/queue
    paths:
      - 'content/queue/**'

concurrency:
  group: content-pipeline-${{ github.event.inputs.queue_ref || 'content/queue' }}
  cancel-in-progress: true

env:
  QUEUE_REF: ${{ github.event.inputs.queue_ref || 'content/queue' }}
  # FEED_NOW 不再写死历史日期：由队列提交的 committer date 决定
  # （同一队列 SHA → 同一时间戳，可复现；不同批次 → 新时间戳，RSS 不会停在过去）。

jobs:
  # ---------------------------------------------------------------- 1. 只读验证
  validate:
    name: validate / python-3.12
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      queue_sha: ${{ steps.q.outputs.queue_sha }}
      items: ${{ steps.p.outputs.items }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0          # 需要 history 来判定队列 SHA 的先后关系

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 记录来源（main / 队列）
        id: q
        run: |
          echo "main_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git fetch --depth=1 origin "$QUEUE_REF"
          echo "queue_sha=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"

      - name: 运行模式（默认只读）
        env:
          ALLOW_WRITE: ${{ github.event.inputs.allow_write || 'false' }}
          REPO_FLAG: ${{ vars.CONTENT_PIPELINE_WRITE || 'off' }}
        run: |
          if [ "$ALLOW_WRITE" = "true" ] || [ "$REPO_FLAG" = "enabled" ]; then
            echo "本次模式: WRITE（会推候选分支并开 PR）"
          else
            echo "本次模式: READ-ONLY（只校验，不推分支、不开 PR）"
          fi

      - name: 隔离队列内容（不在工作区里改任何东西）
        run: |
          mkdir -p "$RUNNER_TEMP/queue"
          git archive "origin/$QUEUE_REF" content/queue | tar -x -C "$RUNNER_TEMP/queue"

      # 先跑队列消费器的只读模式：schema / id / 操作类型全部校验一遍
      - name: 队列校验（只读）
        id: p
        run: |
          python scripts/process_content_queue.py \
            --queue-dir "$RUNNER_TEMP/queue/content/queue" \
            --queue-sha "${{ steps.q.outputs.queue_sha }}" \
            --check --dry-run --json "$RUNNER_TEMP/queue-report.json" || exit 1
          python - "$RUNNER_TEMP/queue-report.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1], encoding='utf-8'))
          print('items=' + ','.join('%s/%s' % (i['op'], i['id']) for i in r.get('processed', [])))
          PY

      - name: 现有派生数据一致性
        run: |
          python scripts/build_content.py --check
          python scripts/split_posts.py --check
          python gen_feed.py --check

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: queue-report
          path: ${{ runner.temp }}/queue-report.json
          retention-days: 14

  # ---------------------------------------------------------------- 2. 生成候选提交
  candidate:
    name: candidate / python-3.12
    needs: validate
    # 写入门控（严格）：必须**同时**满足
    #   1) 不是显式 dry-run（dry_run='true' 时 allow_write / 仓库变量都不能放行）
    #   2) 有队列条目
    #   3) 写入被授权：手动 allow_write=true，或仓库变量 CONTENT_PIPELINE_WRITE=enabled
    if: >-
      github.event.inputs.dry_run != 'true'
      && needs.validate.outputs.items != ''
      && (github.event.inputs.allow_write == 'true' || vars.CONTENT_PIPELINE_WRITE == 'enabled')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write           # 只在这一步需要写：推候选分支
    outputs:
      head: ${{ steps.push.outputs.head }}
      candidate_sha: ${{ steps.push.outputs.candidate_sha }}
      base_main_sha: ${{ steps.src.outputs.main_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 记录来源 SHA（并核对与 validate 用的是同一个队列提交）
        id: src
        run: |
          set -euo pipefail
          MAIN_SHA=$(git rev-parse HEAD)
          git fetch --depth=1 origin "$QUEUE_REF"
          QUEUE_SHA=$(git rev-parse FETCH_HEAD)
          # 绑定校验：validate 与 candidate 必须是同一个队列 SHA
          if [ -n "${{ needs.validate.outputs.queue_sha }}" ] && [ "$QUEUE_SHA" != "${{ needs.validate.outputs.queue_sha }}" ]; then
            echo "队列 SHA 不一致：validate=${{ needs.validate.outputs.queue_sha }} candidate=$QUEUE_SHA，中止"
            exit 1
          fi
          echo "MAIN_SHA=$MAIN_SHA" >> "$GITHUB_ENV"
          echo "QUEUE_SHA=$QUEUE_SHA" >> "$GITHUB_ENV"
          echo "main_sha=$MAIN_SHA" >> "$GITHUB_OUTPUT"
          echo "queue_sha=$QUEUE_SHA" >> "$GITHUB_OUTPUT"
          # 确定性 + 不过期：用队列提交自身的 committer date 作为 feed 时间戳
          FEED_NOW=$(git show -s --format=%cI FETCH_HEAD)
          echo "FEED_NOW=$FEED_NOW" >> "$GITHUB_ENV"
          echo "模式: WRITE  main=$MAIN_SHA  queue=$QUEUE_SHA  feedNow=$FEED_NOW"

      - name: 取队列内容
        run: |
          mkdir -p "$RUNNER_TEMP/queue"
          git archive "origin/$QUEUE_REF" content/queue | tar -x -C "$RUNNER_TEMP/queue"

      # 候选目录 = main 的完整副本 + 队列变更 + 重新生成的派生数据
      - name: 生成候选（规范化 + 全量派生）
        run: |
          python scripts/process_content_queue.py \
            --queue-dir "$RUNNER_TEMP/queue/content/queue" \
            --queue-sha "$QUEUE_SHA" \
            --work-dir "$RUNNER_TEMP/candidate" \
            --base-sha "$MAIN_SHA" \
            --now "$FEED_NOW" \
            --json "$RUNNER_TEMP/candidate-report.json"

      - name: 候选自检（只读）
        run: |
          python scripts/build_content.py --check --root "$RUNNER_TEMP/candidate"
          python scripts/split_posts.py  --check --root "$RUNNER_TEMP/candidate"
          python gen_feed.py --check \
            --data "$RUNNER_TEMP/candidate/js/data.js" \
            --user-posts "$RUNNER_TEMP/candidate/js/user-posts.js" \
            --out "$RUNNER_TEMP/candidate/feed.xml"

      # 完整回归必须**在候选副本里**跑（不是 main 工作区）：
      # 依赖、浏览器、内容门禁、候选哈希都在 $RUNNER_TEMP/candidate 下。
      - name: 候选目录安装依赖
        working-directory: ${{ runner.temp }}/candidate
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: 候选目录完整回归
        working-directory: ${{ runner.temp }}/candidate
        env:
          PW_CHANNEL: chromium
        run: |
          python scripts/run_tests.py

      - name: 候选产物哈希（留档，供 PR 正文与人工核对）
        id: hashes
        run: |
          cd "$RUNNER_TEMP/candidate"
          for f in js/data.js data/search-index.json data/posts/manifest.json feed.xml; do
            printf '%s  %s\n' "$(sha256sum "$f" | cut -d' ' -f1)" "$f"
          done | tee "$RUNNER_TEMP/candidate-hashes.txt"
          echo "hashes=$(paste -sd',' "$RUNNER_TEMP/candidate-hashes.txt" | cut -c1-300)" >> "$GITHUB_OUTPUT"

      - name: 推送前确认 main 未变化
        run: |
          CURRENT=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$CURRENT" != "$MAIN_SHA" ]; then
            echo "main 已从 $MAIN_SHA 变为 $CURRENT：候选已过期，放弃推送（不会自动重试）"
            exit 1
          fi

      - name: 从 main 切候选分支并提交
        id: push
        run: |
          set -euo pipefail
          HEAD_BRANCH="content/candidate-${QUEUE_SHA:0:8}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 只把候选目录里"受版本控制"的文件写回工作区（不含 .git / node_modules）
          rsync -a --delete --exclude '.git' --exclude 'node_modules' \
            "$RUNNER_TEMP/candidate/" ./
          git checkout -B "$HEAD_BRANCH"
          git add -A js/data.js data feed.xml content/ledger.json
          if git diff --cached --quiet; then
            echo "没有变化：队列条目可能已被处理"
            exit 0
          fi
          git commit -m "content: 候选批次 ${QUEUE_SHA:0:8}（来自 ${MAIN_SHA:0:8}）"
          git push origin "$HEAD_BRANCH"
          echo "head=$HEAD_BRANCH" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------- 3. 开候选 PR
  open-pr:
    name: open-pr
    needs: [validate, candidate]
    if: needs.candidate.outputs.head != '' && github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write      # 只在这一步需要 PR 写权限
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 开 PR 前确认 main 未变化
        id: main
        run: |
          set -euo pipefail
          BASE_MAIN="${{ needs.candidate.outputs.base_main_sha }}"
          CURRENT=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ -n "$BASE_MAIN" ] && [ "$CURRENT" != "$BASE_MAIN" ]; then
            echo "main 已从 $BASE_MAIN 变为 $CURRENT：候选过期，不开 PR（请重新触发流水线）"
            exit 1
          fi
          echo "main=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "模式: WRITE(open-pr)  head=${{ needs.candidate.outputs.head }}  base main=$CURRENT"

      - name: 创建/复用候选 PR（不合并）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/candidate_pr.py \
            --head "${{ needs.candidate.outputs.head }}" \
            --base main \
            --title "内容候选：${{ needs.validate.outputs.items }}" \
            --main-sha "${{ steps.main.outputs.main }}" \
            --queue-sha "${{ needs.validate.outputs.queue_sha }}" \
            --candidate-sha "${{ needs.candidate.outputs.candidate_sha }}" \
            --items "${{ needs.validate.outputs.items }}" \
            --require-main-sha "${{ needs.candidate.outputs.base_main_sha }}" \
            --current-main-sha "${{ steps.main.outputs.main }}" \
            --repo "${{ github.repository }}"

  # ---------------------------------------------------------------- 4. 失败可追踪
  report-failure:
    name: 记录失败（不发布）
    needs: [validate, candidate]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: |
          echo "内容流水线失败：main 与生产站点均未被改动。"
          echo "请查看 validate / candidate 的日志；修复后重新入队或手动 workflow_dispatch。"
          exit 1
