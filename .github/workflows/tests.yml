name: tests

# 推送与 PR 都跑；也可在 Actions 页面手动触发
on:
  push:
  pull_request:
  workflow_dispatch:

# 最小权限：只需要读仓库内容（不发布、不写 PR、用不到任何 Secrets）
permissions:
  contents: read

# 同一分支的旧任务在新提交到达时自动取消，避免排队
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: node-22 / python-3.12
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 严格按 package-lock.json 安装（版本漂移会直接失败）
      - name: 安装依赖
        run: npm ci

      # 真实浏览器测试用 Playwright 自带 Chromium（版本随依赖锁定）
      - name: 安装 Chromium
        run: npx playwright install --with-deps chromium
        env:
          PW_CHANNEL: chromium

      - name: 运行时版本
        run: |
          node --version
          npm --version
          python --version
          echo "TZ=$(date +%Z)  $(date -Iseconds)"

      # 统一入口：环境检查 → 语法检查 → audit + test6~test15
      # 退出码 0=通过 1=失败 2=环境阻塞，非 0 都会让 job 失败
      - name: 运行测试
        env:
          PW_CHANNEL: chromium
        run: python scripts/run_tests.py --report tests/reports/last-run.md --json tests/reports/last-run.json

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            tests/reports/
            tests/browser/artifacts/
          retention-days: 14
          if-no-files-found: warn
