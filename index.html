<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Eric 的个人技术随笔 — 智能制造、机器人、具身智能与生活思考">
  <title>Eric's Notebook</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦐</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="vendor/atom-one-light.min.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
</head>
<body>
  <!-- Header -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="#/" class="logo">
        <span class="logo-icon">🦐</span>
        <span class="logo-text">Eric's Notebook</span>
      </a>
      <nav class="nav">
        <a href="#/" class="nav-link" data-route="/">首页</a>
        <a href="#/courses" class="nav-link" data-route="/courses">课程</a>
        <a href="#/papers" class="nav-link" data-route="/papers">论文</a>
        <a href="#/tags" class="nav-link" data-route="/tags">标签</a>
        <a href="#/projects" class="nav-link" data-route="/projects">项目</a>
        <a href="#/archive" class="nav-link" data-route="/archive">归档</a>
        <a href="#/editor" class="nav-link" data-route="/editor">编辑</a>
        <a href="#/about" class="nav-link" data-route="/about">关于</a>
      </nav>
      <button class="theme-toggle" id="themeToggle" aria-label="切换深色模式">🌙</button>
      <button class="menu-toggle" id="menuToggle" aria-label="菜单">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <!-- Search bar (only on home) -->
  <div class="search-bar" id="searchBar">
    <div class="container">
      <div class="search-wrap">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="searchInput" placeholder="搜索文章..." class="search-input">
      </div>
    </div>
  </div>

  <!-- Main content -->
  <main class="container" id="app">
    <!-- Content rendered by JS -->
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2024-2026 Eric's Notebook · 用文字记录思考</p>
      <p class="footer-sub">Powered by vanilla JS & Markdown</p>
    </div>
  </footer>

  <!-- Back to top -->
  <button class="back-to-top" id="backToTop" aria-label="回到顶部">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <polyline points="18 15 12 9 6 15"/>
    </svg>
  </button>

  <!-- Scripts -->
  <script src="vendor/marked.min.js"></script>
  <script src="vendor/highlight.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/user-posts.js"></script>
  <script src="js/courses.js"></script>
  <script src="js/papers.js"></script>
  <script src="js/projects.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
